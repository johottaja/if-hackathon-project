# Publishes the dashboard build, the heatmap and live demo (demo.html) and the Pito app's web build (app/)
# to GitHub Pages. Enable once: Settings → Pages → Source: GitHub Actions.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            mobile/package-lock.json
      - name: Install
        run: npm ci --prefix dashboard && npm ci --prefix mobile
      - name: Test
        run: npm test --prefix dashboard
      - name: Build dashboard, demo and Pito app
        working-directory: dashboard
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}/app
        run: npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
